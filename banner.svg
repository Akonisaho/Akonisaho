  <text x="70" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="0.5">Takalani Akonisaho</text>
  <text x="70" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#7fd8cf">Software Engineer&#160;&#160;|&#160;&#160;Agentic AI &amp; LLM Systems</text>

